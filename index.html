<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Norauto Amboise - Multi-Pages</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f4; }
        
        /* Menu de navigation */
        nav { background: #004593; padding: 20px; text-align: center; position: fixed; width: 100%; top: 0; }
        nav a { color: white; margin: 0 20px; cursor: pointer; font-weight: bold; text-decoration: none; font-size: 18px; }
        nav a:hover { color: #ffca00; }

        /* Style des pages */
        .page { 
            display: none; /* CACHE TOUT PAR DÉFAUT */
            padding: 100px 50px; 
            text-align: center; 
            min-height: 80vh;
        }

        /* La page active devient visible */
        .active { display: block !important; }

        .card { background: white; padding: 20px; margin: 10px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); display: inline-block; width: 250px; }
        .price { font-size: 24px; color: #004593; font-weight: bold; }
        button { background: #ffca00; border: none; padding: 15px 30px; font-weight: bold; cursor: pointer; border-radius: 5px; }
    </style>
</head>
<body>

    <nav>
        <a onclick="ouvrir('accueil')">ACCUEIL</a>
        <a onclick="ouvrir('tarifs')">NOS TARIFS</a>
        <a onclick="ouvrir('rdv')">PRENDRE RDV</a>
    </nav>

    <section id="accueil" class="page active">
        <h1>BIENVENUE CHEZ NORAUTO AMBOISE</h1>
        <p>Votre expert automobile en ville.</p>
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/4f/Logo_Norauto.svg/1200px-Logo_Norauto.svg.png" width="300">
        <br><br>
        <button onclick="ouvrir('tarifs')">Voir les prix</button>
    </section>

    <section id="tarifs" class="page">
        <h1>NOS TARIFS</h1>
        <div class="card"><h3>BATTERIE</h3><p class="price">250 €</p></div>
        <div class="card"><h3>MOTEUR</h3><p class="price">1 200 €</p></div>
        <div class="card"><h3>FLOCAGE</h3><p class="price">2 500 €</p></div>
        <div class="card"><h3>COURROIE</h3><p class="price">500 €</p></div>
    </section>

    <section id="rdv" class="page">
        <h1>PRENDRE RENDEZ-VOUS</h1>
        <form style="max-width: 400px; margin: auto; background: white; padding: 30px; border-radius: 10px;">
            <input type="text" placeholder="Nom RP" style="width:100%; padding:10px; margin-bottom:10px;">
            <input type="text" placeholder="Véhicule" style="width:100%; padding:10px; margin-bottom:10px;">
            <button type="button" style="width:100%;">Envoyer</button>
        </form>
    </section>

    <script>
        function ouvrir(nomDeLaPage) {
            // 1. On cache toutes les pages
            var pages = document.getElementsByClassName('page');
            for (var i = 0; i < pages.length; i++) {
                pages[i].classList.remove('active');
            }
            // 2. On affiche uniquement la page demandée
            document.getElementById(nomDeLaPage).classList.add('active');
        }
    </script>

</body>
</html>
